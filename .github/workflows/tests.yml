name: tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
        if: matrix.php != '8.3'

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover=clover.xml
        if: matrix.php == '8.3'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.php == '8.3'
        with:
          files: clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint-legacy:
    runs-on: ubuntu-latest
    name: Syntax check PHP 5.6

    # composer.json advertises php >=5.6.0 for consumers of the library.
    # PHPUnit 9 needs PHP 7.3, so the suite cannot run there, but the sources
    # must still parse on the oldest version the package claims to support.
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint sources
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
